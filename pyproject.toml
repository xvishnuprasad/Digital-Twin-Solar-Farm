[project]
name = "solar-twin-sim"
version = "0.1.0"
description = "Simulation & verification harness for the Digital-Twin-Solar-Farm system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pvlib>=0.16.1",
    "pydantic>=2",
    "pyyaml>=6.0.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["sim/tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
